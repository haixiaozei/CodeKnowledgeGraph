# CodeKnowledgeGraph 服务端部署
# 用法: NEO4J_PASSWORD=强密码 docker compose up -d --build
services:
  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?请在 .env 或环境变量中设置 NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:7474:7474"   # Neo4j 浏览器: 只绑本机,避免公网暴露
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      # 覆盖 application.yaml 的连接配置,指向 compose 内的 neo4j
      - SPRING_DATA_NEO4J_URI=bolt://neo4j:7687
      - SPRING_DATA_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_DATA_NEO4J_AUTHENTICATION_PASSWORD=${NEO4J_PASSWORD}
      - SERVER_PORT=8080
    ports:
      # 只绑回环: 公网访问请走反向代理(nginx/caddy)并加认证,见 docs/deployment.md
      - "127.0.0.1:8080:8080"
    volumes:
      # 本地路径模式分析: 把要分析的仓库挂进来,然后用 /workspace/xxx 作为 path
      - ./workspace:/workspace

volumes:
  neo4j-data:
